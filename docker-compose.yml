version: '3.8'
services:
  mongo:
    image: mongo:6
    ports: ['27017:27017']
    volumes: [mongo-data:/data/db]

  server:
    build: ./server
    ports: ['5000:5000']
    environment:
      - MONGO_URI=mongodb://mongo:27017/collab-editor
      - JWT_SECRET=your_secret_here
      - CLIENT_URL=http://localhost:3000
    depends_on: [mongo]

  client:
    build: ./client
    ports: ['3000:80']
    depends_on: [server]

volumes:
  mongo-data: